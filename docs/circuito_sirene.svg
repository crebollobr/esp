<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">Sirene e botão no ESP32-S3</text>

  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <!-- +12 V -->
    <path d="M480 60 H810 V250" stroke="#c0392b"/>
    <path d="M480 60 V90" stroke="#c0392b"/>
    <path d="M590 60 V96" stroke="#c0392b"/>
    <!-- sirene (-) ate o dreno -->
    <path d="M480 140 V190"/>
    <path d="M480 165 H590 V134"/>
    <!-- gate -->
    <path d="M260 225 H300"/>
    <path d="M370 225 H440"/>
    <path d="M400 225 V300"/>
    <!-- botao -->
    <path d="M260 380 H300"/>
    <path d="M356 380 H385 V460"/>
    <!-- GND -->
    <path d="M400 360 V460"/>
    <path d="M480 260 V460"/>
    <path d="M260 430 H280 V460"/>
    <path d="M280 460 H810"/>
    <path d="M810 330 V460"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="400" cy="225" r="4"/>
    <circle cx="480" cy="165" r="4"/>
    <circle cx="590" cy="60" r="4"/>
    <circle cx="400" cy="460" r="4"/>
    <circle cx="480" cy="460" r="4"/>
    <circle cx="385" cy="460" r="4"/>
  </g>

  <!-- placa -->
  <rect x="40" y="80" width="220" height="380" rx="10" fill="#eef4fb" stroke="#2c6fbb" stroke-width="2"/>
  <text x="150" y="112" text-anchor="middle" font-weight="bold" fill="#1a1a1a">ESP32-S3</text>
  <text x="150" y="132" text-anchor="middle" fill="#444">Freenove WROOM CAM</text>
  <text x="150" y="152" text-anchor="middle" fill="#444">alimentada pelo USB</text>
  <text x="248" y="230" text-anchor="end" font-weight="bold" fill="#1a1a1a">GPIO 14</text>
  <text x="248" y="385" text-anchor="end" font-weight="bold" fill="#1a1a1a">GPIO 21</text>
  <text x="248" y="435" text-anchor="end" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="56" y="250" fill="#555" font-size="12">saída: liga a sirene</text>
  <text x="56" y="405" fill="#555" font-size="12">entrada (pull-up interno)</text>
  <circle cx="260" cy="225" r="4" fill="#2c6fbb"/>
  <circle cx="260" cy="380" r="4" fill="#2c6fbb"/>
  <circle cx="260" cy="430" r="4" fill="#2c6fbb"/>

  <!-- R1 -->
  <rect x="300" y="215" width="70" height="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="335" y="205" text-anchor="middle" fill="#1a1a1a">R1 220 Ω</text>

  <!-- R2 -->
  <rect x="390" y="300" width="20" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="418" y="325" fill="#1a1a1a">R2</text>
  <text x="418" y="343" fill="#1a1a1a">10 kΩ</text>

  <!-- botao -->
  <circle cx="304" cy="380" r="4" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="352" cy="380" r="4" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M300 364 H356 M328 364 V350 M318 350 H338" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="328" y="410" text-anchor="middle" fill="#1a1a1a">S1 botão</text>
  <text x="328" y="428" text-anchor="middle" fill="#555" font-size="12">desliga a sirene</text>

  <!-- MOSFET -->
  <rect x="440" y="190" width="80" height="70" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="222" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Q1</text>
  <text x="480" y="242" text-anchor="middle" font-size="12" fill="#1a1a1a">IRLZ44N</text>
  <text x="446" y="217" font-size="12" fill="#555">G</text>
  <text x="486" y="204" font-size="12" fill="#555">D</text>
  <text x="486" y="256" font-size="12" fill="#555">S</text>
  <text x="530" y="222" font-size="12" fill="#555">MOSFET canal N</text>
  <text x="530" y="238" font-size="12" fill="#555">(nível lógico)</text>

  <!-- sirene -->
  <rect x="430" y="90" width="100" height="50" rx="6" fill="#fdf0e6" stroke="#d35400" stroke-width="2"/>
  <text x="480" y="113" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Sirene</text>
  <text x="480" y="131" text-anchor="middle" font-size="12" fill="#1a1a1a">12 V</text>
  <text x="438" y="86" font-size="13" font-weight="bold" fill="#c0392b">+</text>
  <text x="438" y="156" font-size="15" font-weight="bold" fill="#1a1a1a">−</text>

  <!-- diodo: anodo embaixo (dreno), catodo em cima (+12 V) -->
  <path d="M578 134 L602 134 L590 112 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M578 108 H602" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M590 96 V108" stroke="#c0392b" stroke-width="2"/>
  <text x="612" y="118" fill="#1a1a1a">D1 1N4007</text>
  <text x="612" y="135" font-size="12" fill="#555">protege o MOSFET</text>

  <!-- fonte 12 V -->
  <rect x="760" y="250" width="100" height="80" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="810" y="285" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Fonte</text>
  <text x="810" y="303" text-anchor="middle" fill="#1a1a1a">12 V</text>
  <text x="818" y="246" font-size="13" font-weight="bold" fill="#c0392b">+</text>
  <text x="818" y="346" font-size="15" font-weight="bold" fill="#1a1a1a">−</text>
  <text x="700" y="52" fill="#c0392b" font-weight="bold">+12 V</text>

  <!-- GND -->
  <text x="560" y="482" fill="#1a1a1a" font-weight="bold">GND comum</text>
  <text x="560" y="500" font-size="12" fill="#555">o − da fonte 12 V TEM que ir no GND da placa</text>

  <text x="24" y="536" font-size="12" fill="#555">GPIO 14 = 1: Q1 conduz e a sirene toca. R2 mantém a sirene desligada enquanto a placa liga. Botão apertado: GPIO 21 vai a 0.</text>
</svg>
