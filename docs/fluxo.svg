<text x="104" y="120" text-anchor="middle" font-size="11.5" fill="#555">0,64 s por quadro</text>
<rect x="208.0" y="60" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9c9c0" stroke-width="1.25"/>
<text x="288" y="84" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Modelo de pessoas</text>
<text x="288" y="104" text-anchor="middle" font-size="11.5" fill="#555">pedestrian_detect</text>
<text x="288" y="120" text-anchor="middle" font-size="11.5" fill="#555">caixas com score ≥ 0.3</text>
<rect x="392.0" y="60" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9c9c0" stroke-width="1.25"/>
<text x="472" y="84" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Filtro</text>
<text x="472" y="104" text-anchor="middle" font-size="11.5" fill="#555">em pé exige score 0.7</text>
<text x="472" y="120" text-anchor="middle" font-size="11.5" fill="#555">nasce em pé, 3 quadros</text>
<rect x="576.0" y="60" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9c9c0" stroke-width="1.25"/>
<text x="656" y="84" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Rastreio</text>
<text x="656" y="104" text-anchor="middle" font-size="11.5" fill="#555">par mais perto antes</text>
<text x="656" y="120" text-anchor="middle" font-size="11.5" fill="#555">até 0.6 x o tamanho</text>
<rect x="576.0" y="172" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9c9c0" stroke-width="1.25"/>
<text x="656" y="196" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Postura</text>
<text x="656" y="216" text-anchor="middle" font-size="11.5" fill="#555">h/w acima de 1.5: em pé</text>
<text x="656" y="232" text-anchor="middle" font-size="11.5" fill="#555">abaixo de 0.7: chão</text>
