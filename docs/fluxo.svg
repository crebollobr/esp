<text x="472" y="196" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Velocidade</text>
<text x="472" y="216" text-anchor="middle" font-size="11.5" fill="#555">da cabeça, nas 3</text>
<text x="472" y="232" text-anchor="middle" font-size="11.5" fill="#555">últimas posições</text>
<rect x="208.0" y="172" width="160" height="72" rx="8" fill="#ffffff" stroke="#c9c9c0" stroke-width="1.25"/>
